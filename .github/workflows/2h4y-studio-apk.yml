name: Android 1.0 APK bauen
on:
  workflow_dispatch:
  push:
    branches: [studio-v1]
    paths:
      - 'studio-3d/android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android Plattform installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK kompilieren
        working-directory: studio-3d/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: 2H4Y-3D-Studio-1.0-debug-APK
          path: studio-3d/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
