name: 2H4Y STL Studio APK
on:
  push:
    branches: [2h4y-stl-studio-v1]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installieren
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)
          echo "SDK Manager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo "SDK Manager fehlt"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 2H4Y-STL-Studio-1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
